    <text x="462" y="406" fill="#e8eef5" font-size="9" font-weight="600">rag-fundamentals.md</text>
    <text x="576" y="406" fill="#5f6c7b" font-size="8">page 1</text>
    <text x="1050" y="406" fill="#5f6c7b" font-size="7.5" text-anchor="end">dense 0.842 · bm25 4.12</text>
    <text x="438" y="422" fill="#8b98a7" font-size="8.5">Reciprocal Rank Fusion combines several ranked lists without needing their scores...</text>
    <text x="438" y="435" fill="#8b98a7" font-size="8.5">The constant k is usually 60. A document ranked highly by both methods rises...</text>

    <rect x="424" y="452" width="686" height="54" rx="9" fill="#0b1118" stroke="#1e2a38"/>
    <text x="438" y="468" fill="#6ee7b7" font-size="8.5" font-weight="700">[2]</text>
    <text x="462" y="468" fill="#e8eef5" font-size="9" font-weight="600">rag-fundamentals.md</text>
    <text x="576" y="468" fill="#5f6c7b" font-size="8">page 1</text>
    <text x="1050" y="468" fill="#5f6c7b" font-size="7.5" text-anchor="end">dense 0.801 · bm25 3.57</text>
    <text x="438" y="484" fill="#8b98a7" font-size="8.5">BM25 is a classic sparse ranking function that combines term frequency...</text>
    <text x="438" y="497" fill="#8b98a7" font-size="8.5">BM25 excels at exact matches: names, error messages, API symbols...</text>

    <rect x="424" y="514" width="686" height="54" rx="9" fill="#0b1118" stroke="#1e2a38"/>
    <text x="438" y="530" fill="#6ee7b7" font-size="8.5" font-weight="700">[3]</text>
    <text x="462" y="530" fill="#e8eef5" font-size="9" font-weight="600">rag-fundamentals.md</text>
    <text x="576" y="530" fill="#5f6c7b" font-size="8">page 1</text>
    <text x="1050" y="530" fill="#5f6c7b" font-size="7.5" text-anchor="end">dense 0.774 · bm25 2.91</text>
    <text x="438" y="546" fill="#8b98a7" font-size="8.5">Maximal Marginal Relevance balances relevance and diversity when selecting...</text>
    <text x="438" y="559" fill="#8b98a7" font-size="8.5">With lambda near 1 the selection is relevance-focused; near 0 it is diverse...</text>

    <text x="424" y="592" fill="#5f6c7b" font-size="8">qwen2.5-coder:3b-instruct-q8_0 · 3 sources · 41.8 tok/s · 2.4s</text>

