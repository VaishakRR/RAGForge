    <circle cx="1061" cy="66.5" r="4" fill="#f2f8ff"/>

    <!-- User message -->
    <rect x="790" y="124" width="320" height="44" rx="14" fill="url(#userBubble)" stroke="#245066"/>
    <text x="806" y="143" fill="#e8eef5" font-size="10">How does reciprocal rank fusion work,</text>
    <text x="806" y="157" fill="#e8eef5" font-size="10">and why combine it with BM25?</text>

    <!-- Assistant message -->
    <rect x="362" y="190" width="32" height="32" rx="10" fill="#13251f" stroke="#1f4438"/>
    <rect x="370" y="197" width="16" height="5" rx="2.5" fill="#6ee7b7"/>
    <rect x="372" y="205" width="12" height="4" rx="2" fill="#6ee7b7" opacity="0.7"/>
    <rect x="374" y="212" width="8" height="3" rx="1.5" fill="#6ee7b7" opacity="0.45"/>

    <rect x="406" y="190" width="704" height="166" rx="14" fill="#111923" stroke="#1e2a38"/>
    <text x="424" y="214" fill="#e8eef5" font-size="10.5">Reciprocal Rank Fusion combines several ranked lists without needing their</text>
    <text x="424" y="230" fill="#e8eef5" font-size="10.5">scores to share a scale. Each document receives a contribution from every</text>
    <text x="424" y="246" fill="#e8eef5" font-size="10.5">list it appears in, using 1 / (k + rank). Dense retrieval is strong at</text>
    <text x="424" y="262" fill="#e8eef5" font-size="10.5">paraphrases, while BM25 catches exact identifiers and rare keywords.</text>
    <text x="424" y="282" fill="#e8eef5" font-size="10.5">A document ranked highly by both methods rises to the top.</text>
    <rect x="746" y="271" width="18" height="15" rx="4" fill="#10303f" stroke="#2d6a86"/>
    <text x="755" y="282" fill="#a8e4ff" font-size="8" font-weight="700" text-anchor="middle">1</text>
    <rect x="768" y="271" width="18" height="15" rx="4" fill="#10303f" stroke="#2d6a86"/>
    <text x="777" y="282" fill="#a8e4ff" font-size="8" font-weight="700" text-anchor="middle">2</text>

